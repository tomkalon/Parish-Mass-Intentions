{{define "badges" -}}
{{if and .IsDeceased (not .IsGregorian)}} <span class="badge badge-deceased" title="Intencja za zmarłych"><svg class="badge-icon" width="11" height="15" viewBox="0 0 11 15" aria-hidden="true" focusable="false"><path d="M4.6 0h1.8v3.6H10v1.7H6.4V15H4.6V5.3H1V3.6h3.6z" fill="currentColor"/></svg>za zmarłych</span>{{end -}}
{{if .IsGregorian}} {{if .SeriesStep}}<a class="badge badge-gregorian" href="{{.SeriesURL}}" title="Msza gregoriańska {{.SeriesStep}} z 30 – pokaż serię"><svg class="badge-icon" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true" focusable="false"><path d="M6 .5C7.9 2.6 8.3 4.3 6 6.1 3.7 4.3 4.1 2.6 6 .5z" fill="#D9921E"/><path d="M6 2.6c.8 1 .9 1.8 0 2.6-.9-.8-.8-1.6 0-2.6z" fill="#F6D27A"/><rect x="5.6" y="5.9" width=".8" height="1.4" fill="#5A4636"/><rect x="3.3" y="7.2" width="5.4" height="8.3" rx="1" fill="currentColor"/><rect x="4.2" y="8.2" width="1.1" height="6" rx=".5" fill="#fff" opacity=".35"/></svg>gregoriańska <span class="series-step">{{.SeriesStep}}/30</span></a>{{else}}<span class="badge badge-gregorian" title="Msza gregoriańska"><svg class="badge-icon" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true" focusable="false"><path d="M6 .5C7.9 2.6 8.3 4.3 6 6.1 3.7 4.3 4.1 2.6 6 .5z" fill="#D9921E"/><path d="M6 2.6c.8 1 .9 1.8 0 2.6-.9-.8-.8-1.6 0-2.6z" fill="#F6D27A"/><rect x="5.6" y="5.9" width=".8" height="1.4" fill="#5A4636"/><rect x="3.3" y="7.2" width="5.4" height="8.3" rx="1" fill="currentColor"/><rect x="4.2" y="8.2" width="1.1" height="6" rx=".5" fill="#fff" opacity=".35"/></svg>gregoriańska</span>{{end}}{{end -}}
{{if .IsHidden}} <span class="badge badge-hidden" title="Ta intencja nie pojawi się na wydruku"><svg class="badge-icon" width="15" height="12" viewBox="0 0 15 12" aria-hidden="true" focusable="false"><path d="M1.2 6S3.6 1.8 7.5 1.8 13.8 6 13.8 6 11.4 10.2 7.5 10.2 1.2 6 1.2 6z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="6" r="1.9" fill="currentColor"/><path d="M2.5 11.2 12.5.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>ukryta na wydruku</span>{{end -}}
{{- end}}
