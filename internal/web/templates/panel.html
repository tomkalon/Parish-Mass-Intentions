{{define "panel" -}}
<aside class="panel" role="complementary" aria-labelledby="panel-title">
	<form class="panel-form" method="post" action="/intentions">
		<header class="panel-header">
			<h2 class="panel-title" id="panel-title">Nowa intencja</h2>
			<a class="panel-close" href="{{.CloseURL}}" aria-label="Zamknij">×</a>
		</header>

		<div class="panel-body">
			<input type="hidden" name="week" value="{{.Week}}">

			<fieldset class="field">
				<legend class="label">Dzień · {{.Legend}}</legend>
				<div class="day-tiles">
					{{- range .Days}}
					<div class="day-tile">
						<input type="radio" id="day-{{.Value}}" name="day" value="{{.Value}}"{{if .Checked}} checked{{end}} required>
						<label for="day-{{.Value}}"><span class="short">{{.Short}}</span><span class="date">{{.Date}}</span></label>
					</div>
					{{- end}}
				</div>
				<p class="hint">Inny tydzień? Użyj strzałek „Poprzedni / Następny” w widoku w tle.</p>
			</fieldset>

			<div class="field">
				<label class="label" for="time">Godzina</label>
				<select class="select" id="time" name="time" required>
					<option value="">wybierz</option>
					{{- range .Times}}
					<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>
					{{- end}}
				</select>
			</div>

			<div class="field">
				<label class="label" for="content">Treść intencji</label>
				<textarea class="textarea" id="content" name="content" maxlength="500" required autofocus>{{.Content}}</textarea>
			</div>

			<label class="checkbox"><input type="checkbox" name="outside"{{if .IsOutsideParish}} checked{{end}}> Poza parafią</label>
		</div>

		<footer class="panel-footer">
			<button class="button button-primary" type="submit">Zapisz</button>
			<a class="button" href="{{.CloseURL}}">Anuluj</a>
		</footer>
	</form>
</aside>
{{- end}}
