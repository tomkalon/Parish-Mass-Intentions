<!doctype html>
<html lang="pl">
<head>
	<meta charset="utf-8">
	<title>Wydruk {{.Title}} – Go Parafia</title>
	<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
	<link rel="stylesheet" href="/static/app.css">
	<script src="/static/app.js" defer></script>
</head>
<body class="print-page">
	<nav class="toolbar" aria-label="Wydruk">
		<a class="button" href="{{.BackURL}}" data-close>← Wróć do tygodnia</a>
		<span class="print-note">INTENCJE MSZY ŚWIĘTYCH – {{.Note}} · A4 pionowo · czarno-biały</span>
		<form class="print-options" method="get" action="/print">
			<input type="hidden" name="week" value="{{.Week}}">
			{{- with .Day}}
			<input type="hidden" name="day" value="{{.}}">
			{{- end}}
			<fieldset class="print-hidden"{{if not .HiddenCount}} disabled title="W tym {{if .IsDay}}dniu{{else}}tygodniu{{end}} nie ma ukrytych intencji"{{end}}>
				<legend class="print-hidden-label">Ukryte intencje ({{.HiddenCount}})</legend>
				<div class="segmented">
					{{- range $i, $mode := .HiddenModes}}
					<input type="radio" id="p-hidden-{{$i}}" name="hidden" value="{{$mode.Value}}"{{if $mode.Selected}} checked{{end}} data-autosubmit>
					<label for="p-hidden-{{$i}}">{{$mode.Label}}</label>
					{{- end}}
				</div>
			</fieldset>
			<label class="checkbox" title="{{if .OnlyHidden}}Niedostępne przy wydruku tylko ukrytych intencji{{else}}Wykropkowane linie na Msze bez intencji, do wpisania długopisem{{end}}"><input type="checkbox" id="p-blanks" name="blanks" value="1"{{if .Options.Blanks}} checked{{end}}{{if .OnlyHidden}} disabled{{end}} data-autosubmit> Miejsca do wpisania</label>
			{{- if .Options.Blanks}}
			<input type="hidden" name="set" value="1">
			<label class="print-field" for="p-lines">Linii na pustą Mszę
				<select class="select" id="p-lines" name="lines" data-autosubmit>
					{{- range .Lines}}
					<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>
					{{- end}}
				</select>
			</label>
			<label class="checkbox"><input type="checkbox" id="p-extra" name="extra" value="1"{{if .Options.Extra}} checked{{end}} data-autosubmit> Linia także pod uzupełnionymi Mszami</label>
			<label class="checkbox" title="Dla tygodnia bez wczytanych godzin Msze zostaną wzięte z porządku Mszy"><input type="checkbox" id="p-planned" name="planned" value="1"{{if .Options.Planned}} checked{{end}} data-autosubmit> Godziny z porządku Mszy</label>
			{{- if .Schedules}}
			<select class="select" id="p-schedule" name="schedule" aria-label="Porządek Mszy dla tygodnia bez wczytanych godzin" data-autosubmit{{if not .Options.Planned}} disabled{{end}}>
				{{- range .Schedules}}
				<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>
				{{- end}}
			</select>
			{{- end}}
			{{- end}}
			<noscript><button class="button" type="submit">Odśwież</button></noscript>
		</form>
	</nav>
	<iframe class="print-preview" src="{{.PDFURL}}" title="Podgląd PDF: intencje {{.Note}}"></iframe>
</body>
</html>
