{{define "topbar" -}}
<div class="topbar-main">
			<a class="topbar-brand" href="/">
				<img src="/static/logo.svg" width="28" height="28" alt="">
				<span>Intencje mszalne</span>
			</a>
			<span class="topbar-parish">{{.ParishName}}{{with .Address}} · {{.}}{{end}}</span>
		</div>
		<form class="topbar-backup" method="post" action="/backup">
			<span class="backup-status{{if .BackupPending}} is-pending{{end}}">{{.BackupLabel}}</span>
			<button class="button-small" type="submit">Wykonaj kopię danych</button>
		</form>
{{- end}}
